name: etflowalign
channels:
  - pyg
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip

  # Scientific / utils
  - numpy=1.26.4
  - scipy
  - pandas
  - scikit-learn
  - tqdm
  - pyyaml
  - networkx
  - pydantic

  # Chemistry stack (from DiffAlign/ET-Flow references)
  - rdkit
  - py3Dmol
  - datamol

  # Visualization / notebooks
  - matplotlib
  - seaborn
  - jupyterlab
  - ipykernel

  # Training helpers
  - lightning
  - torchmetrics

  # Dev / QA
  - pytest
  - black
  - ruff

  # NOTE:
  # - PyTorch / CUDA and PyG are installed by setup_env.sh so users can select CPU vs CUDA.
