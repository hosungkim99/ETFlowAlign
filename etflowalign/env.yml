name: etflowalign
channels:
  - pyg
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip

  # Core scientific stack used by ETFlowAlign scripts
  - numpy=1.26.4
  - scipy
  - tqdm
  - pyyaml
  - networkx

  # Chemistry stack
  - rdkit
  - py3Dmol

  # Visualization / notebooks
  - matplotlib
  - jupyterlab
  - ipykernel

  # Dev / QA
  - pytest

  # NOTE:
  # - PyTorch / CUDA and PyG are installed by setup_env.sh so users can select CPU vs CUDA.
