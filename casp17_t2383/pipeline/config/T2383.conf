# T2383 실행 설정 (casp17_t2383 폴더를 서버 users/hosungkim/targets/T2383/ 아래 둔 경우)
target = T2383

# 팀 cofolding 결과 (READ-ONLY)
results_dir = /gpfs/deepfold/casp/casp17/targets_ligand/T2383/results/A1+T2383_lig/af3_msa

# 출력 = casp17_t2383/outputs (기존 작업물 안 건드림, users/hosungkim 내부)
out_dir = /gpfs/deepfold/casp/casp17-ligand/users/hosungkim/targets/T2383/casp17_t2383/outputs

# 리간드 TSV (Name/Task/SMILES; 경로에 ligands/ligands 중첩 주의)
ligand_tsv = /gpfs/deepfold/casp/casp17-ligand/targets/T2383/ligands/ligands/T2383_lig.tsv

# 스텝 스크립트 폴더 (complex_io.py/geom.py 포함)
scripts_dir = /gpfs/deepfold/casp/casp17-ligand/users/hosungkim/targets/T2383/casp17_t2383/pipeline

# TSV의 Task = PA → affinity 가중치↑
task = PA

# 파라미터 (기본값)
protein_chain     =
conf_threshold    = 15.0
pocket_threshold  = 8.0
topn_pockets      = 10
gnina_cutoff      = -4.0
p2rank_dist       = 6.0
ligand_threshold  = 2.0
top_final         = 5
diversity_topk    = 10
author            = CHANGE-ME

# (선택) 실험 fragment 비교: 로컬 템플릿검색으로 찾은 cif 경로. 비우면 스킵.
experimental_cif  =

python_stdlib = python3
# sbatch 비대화형 셸엔 micromamba가 PATH에 없음 → env의 python을 직접 지정(견고)
# 경로 확인: ls /gpfs/deepfold/casp/casp17-ligand/.micromamba/envs/boltz2/bin/python
python_sci = /gpfs/deepfold/casp/casp17-ligand/.micromamba/envs/boltz2/bin/python

# ① PoseBusters 유효성 검사용 env의 python (posebusters 설치된 env). 비우면 스텝 스킵.
python_pb = /gpfs/deepfold/casp/casp17-ligand/.micromamba/envs/casp_eval/bin/python

# ② 포즈 정제 (gnina --minimize, boltz2). true=on. drift>refine_max_drift Å면 원본 유지.
refine = true
refine_iters = 25
refine_max_drift = 2.0
