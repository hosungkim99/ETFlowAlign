# ============================================================
#  계층형 CASP 리간드 파이프라인 설정 (타겟마다 복사·수정)
#  cp TEMPLATE.conf <TARGET>.conf  후 [필수] 경로 4개 + task 설정
#  형식: key = value  (# 주석)
# ============================================================
target = T2383

# === [필수] 경로 4개 =========================================
results_dir = /gpfs/deepfold/casp/casp17/targets_ligand/T2383/results/A1+T2383_lig/af3_msa
out_dir     = /gpfs/deepfold/casp/casp17-ligand/users/hosungkim/targets/T2383
ligand_tsv  = /gpfs/deepfold/casp/casp17-ligand/targets/T2383/ligands/ligand.tsv
scripts_dir = /gpfs/deepfold/casp/casp17-ligand/users/hosungkim/scripts
# ============================================================

# === Task: P=pose만, PA=pose+affinity (affinity 가중치↑) ===
task = P

# --- [선택] 실험 fragment/template (있으면 워크플로 6번 자동 실행) ---
experimental_cif =

# --- 단계별 파라미터 (기본값 권장) ---
protein_chain     =            # 비우면 전체 체인쌍 평균(범용)
conf_threshold    = 15.0       # Step0 단백질 형태 분리(PC공간)
pocket_threshold  = 8.0        # Step1 포켓(센트로이드) 클러스터 Å
topn_pockets      = 10         # Step1 포켓 후보 수
gnina_cutoff      = -4.0       # Step2 통과: gnina affinity <= 값
p2rank_dist       = 6.0        # Step2 통과: 최근접 p2rank 포켓 거리 <= 값
ligand_threshold  = 2.0        # Step3 포켓별 리간드 SC-RMSD 클러스터 Å
top_final         = 5          # Step4 최종 제출 수
diversity_topk    = 10
author            = CHANGE-ME

# --- 환경 실행 커맨드 ---
python_stdlib = python3
python_sci = micromamba run -n boltz2 python
